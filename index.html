<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homework Helper UK</title>
<style>
:root{--bg:#f4f6ff;--card:#fff;--ink:#1c2340;--mut:#5d6690;--pri:#4f46e5;--acc:#f59e0b;--bd:#dfe3f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--card:#1d2040;--ink:#eef0ff;--mut:#a3aad6;--bd:#2f3466}}
:root[data-theme="dark"]{--bg:#12142a;--card:#1d2040;--ink:#eef0ff;--mut:#a3aad6;--bd:#2f3466}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px;margin-top:8px}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;display:inline-block;text-align:center}
button.ghost,.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button:disabled{opacity:.5}
.big{width:100%;font-size:1.1rem;padding:16px}
#prev{max-width:100%;max-height:200px;border-radius:12px;margin-top:10px;display:none}
.stage{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px;min-height:170px;display:flex;align-items:center;justify-content:center}
.stage svg{width:100%;max-height:220px}
.scene{animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--pri)}
.tag{display:inline-block;background:var(--acc);color:#000;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
.ans{border-left:4px solid var(--acc);padding-left:12px;font-weight:600}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#d33}
</style></head><body><main>
<h1>📚 Homework Helper</h1>
<p class="sub">Snap your homework. Get a clear explanation and a step-by-step animation.</p>

<div class="card" id="keybox" style="display:none"><b>🔑 Anthropic API key</b><p class="sub" style="margin:4px 0 8px">Stored only in this browser. Get one at console.anthropic.com.</p><input id="key" type="password" placeholder="sk-ant-…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--ink)"></div>
<div class="card">
  <div class="row"><div style="flex:1"><select id="lvl">
    <option>KS2 (Years 3–6)</option><option>KS3 (Years 7–9)</option><option selected>GCSE (Years 10–11)</option><option>A-Level</option><option>KS1 (Years 1–2)</option></select></div></div>
  <label class="btn big" style="margin-top:10px;display:block">📷 Take or choose a photo
    <input id="file" type="file" accept="image/*" capture="environment" hidden></label>
  <img id="prev" alt="Your homework">
  <textarea id="txt" placeholder="…or type your question here (optional extra detail too)"></textarea>
  <button id="go" class="big" style="margin-top:10px">✨ Explain it</button>
</div>

<div id="out"></div>
</main>
<script>
let sample=null,img=null,timer=null,scenes=[],cur=0,data=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SUPABASE_URL='https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY='YOUR-ANON-KEY';
function keyStore(v){try{if(v===undefined)return localStorage.getItem('hh_key')||'';localStorage.setItem('hh_key',v)}catch(e){return ''}}
function makeShim(){
  const f=async(prompt,o={})=>{
    if(SUPABASE_URL.includes('YOUR-PROJECT'))throw {code:'cfg',message:'Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script.'};
    let image=null;if(o.images)image=await shrink(o.images);
    const r=await fetch(SUPABASE_URL+'/functions/v1/explain',{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_ANON_KEY,'authorization':'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({prompt,image})});
    const j=await r.json();if(!r.ok)throw {code:'api',message:j.error||'Server error'};
    return j.text;
  };
  f.json=async(p,o)=>{const t=await f(p,o);return JSON.parse(t.replace(/```json|```/g,'').trim())};
  f.limits=async()=>({images:{}});
  return f;
}
function shrink(blob){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85).split(',')[1])};i.onerror=rej;i.src=URL.createObjectURL(blob)})}
(async()=>{
 try{sample=await claude.use("sample")}catch(e){}
 if(!sample)sample=makeShim();
})();
$('file').onchange=e=>{img=e.target.files[0]||null;const p=$('prev');if(img){p.src=URL.createObjectURL(img);p.style.display='block'}};

function cleanSvg(code){
  const d=new DOMParser().parseFromString(code,'image/svg+xml');
  const s=d.documentElement;if(!s||s.nodeName!=='svg'||d.querySelector('parsererror'))return '';
  s.querySelectorAll('script,foreignObject,image,a,iframe').forEach(n=>n.remove());
  [s,...s.querySelectorAll('*')].forEach(n=>[...n.attributes].forEach(a=>{
    if(/^on/i.test(a.name)||/javascript:|url\(\s*['"]?https?:/i.test(a.value)||(/href/i.test(a.name)))n.removeAttribute(a.name)}));
  s.setAttribute('viewBox','0 0 300 170');s.removeAttribute('width');s.removeAttribute('height');
  return new XMLSerializer().serializeToString(s);
}

$('go').onclick=async()=>{
  if(!sample)return;
  const t=$('txt').value.trim();
  if(!img&&!t){$('out').innerHTML='<div class="card err">Add a photo or type a question first.</div>';return}
  stop();$('go').disabled=true;
  $('out').innerHTML='<div class="card"><span class="spin">⏳</span> Reading your homework and building the explanation…</div>';
  const prompt=`You are a friendly UK teacher helping a student at ${$('lvl').value}, following the UK national curriculum / GCSE / A-Level specs. Use British spelling and UK units and money (£). ${img?'The attached image is their homework.':''} ${t?'Student note: '+t:''}
Work out the question(s) (focus on the first if there are many), identify the subject, and TEACH it: explain the idea, then the working, then the answer. Keep language simple and encouraging.
Reply with ONLY JSON (no markdown fences):
{"subject":"","topic":"","question":"one-line restatement of what was asked","explanation":"2-4 short sentences in plain words explaining the key idea","answer":"the final answer, short","scenes":[{"title":"short step title","text":"1-2 sentences narration","svg":"..."}],"tip":"one exam or memory tip"}
Rules for scenes: 3-5 scenes. Each "svg" is a small self-contained <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170"> illustration for that step using shapes, text (font-size 12-18, fill #4f46e5 or #f59e0b or #10b981 or #ef4444 or currentColor) and ANIMATION via SMIL (<animate>, <animateTransform>) or inline <style> @keyframes so things move, appear, draw or highlight (e.g. numbers sliding, arrows drawing, balances tipping, cells dividing, sentence parts highlighting). No scripts, no external images, no <foreignObject>. Keep text inside the viewBox. Make the visuals genuinely explain the step.`;
  try{
    const lim=await sample.limits().catch(()=>({}));
    const opts={modelTier:'default'};
    if(img){ if(!lim.images){throw {code:'noimg',message:'Photos are not supported in this view — please type the question instead.'}} opts.images=img }
    data=await sample.json(prompt,opts);
    render();
  }catch(e){
    $('out').innerHTML='<div class="card err">'+esc(e&&e.code==='not_granted'?'Permission was declined, so I can’t help yet.':(e&&e.message)||'Something went wrong. Try again.')+'</div>';
  }finally{$('go').disabled=false}
};

function render(){
  scenes=(data.scenes||[]).filter(s=>s&&s.text);cur=0;
  $('out').innerHTML=`
  <div class="card"><span class="tag">${esc(data.subject)}</span> <b>${esc(data.topic)}</b>
    <p style="margin:8px 0 0;color:var(--mut)">${esc(data.question)}</p></div>
  <div class="card"><h3 style="margin:0 0 6px">💡 The idea</h3><p style="margin:0">${esc(data.explanation)}</p></div>
  <div class="card"><h3 style="margin:0 0 8px">🎬 Watch it step by step</h3>
    <div class="stage" id="stage"></div><div class="dots" id="dots"></div>
    <div id="cap"></div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="bk">◀</button><button id="pl">▶ Play</button><button class="ghost" id="nx">▶</button><button class="ghost" id="rd">🔊 Read</button>
    </div></div>
  <div class="card"><h3 style="margin:0 0 6px">✅ Answer</h3><div class="ans">${esc(data.answer)}</div>
    ${data.tip?`<p style="margin:10px 0 0;color:var(--mut)">⭐ ${esc(data.tip)}</p>`:''}</div>`;
  $('bk').onclick=()=>{stop();show(cur-1)};$('nx').onclick=()=>{stop();show(cur+1)};
  $('pl').onclick=()=>timer?stop():play();$('rd').onclick=()=>speak(scenes[cur].text);
  show(0);play();
}
function show(i){
  if(!scenes.length)return;cur=(i+scenes.length)%scenes.length;const s=scenes[cur];
  const svg=cleanSvg(s.svg||'');
  $('stage').innerHTML=`<div class="scene" style="width:100%">${svg||'<div style="text-align:center;font-size:3rem">📘</div>'}</div>`;
  $('cap').innerHTML=`<div class="scene"><b>${cur+1}. ${esc(s.title)}</b><p style="margin:4px 0 0">${esc(s.text)}</p></div>`;
  $('dots').innerHTML=scenes.map((_,k)=>`<i class="${k===cur?'on':''}"></i>`).join('');
}
function play(){ $('pl').textContent='⏸ Pause';
  timer=setInterval(()=>{ if(cur>=scenes.length-1){stop();return} show(cur+1)},5500)}
function stop(){clearInterval(timer);timer=null;const b=$('pl');if(b)b.textContent='▶ Play';try{speechSynthesis.cancel()}catch(e){}}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';speechSynthesis.speak(u)}catch(e){}}
</script></body></html>
